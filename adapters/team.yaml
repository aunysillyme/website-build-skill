schema_version: 1
team: website-design-team
coordinator: coordinator
entry_role: researcher
execution_order: [researcher, coordinator, designer, graphics, builder, optimizer, reviewer]
artifact_root: site-work
rules:
  - one-writer-per-artifact
  - ask-date-rule-before-intake-and-research
  - research-gate-before-design
  - each-role-researches-before-execution
  - no-site-code-before-selected-mockup
  - failed-gates-stop-dependent-work
  - reviewer-family-differs-from-builder-family
roles:
  researcher:
    instructions: roles/researcher.md
    owns: [research/library, handoffs/researcher]
  coordinator:
    instructions: roles/coordinator.md
    owns: [brief.md, capabilities.md, status.md, team.md, ownership.yaml, MEMORY.md, research/coordinator, handoffs/coordinator, review]
  designer:
    instructions: roles/designer.md
    owns: [brand, mockups, research/designer, handoffs/designer]
  graphics:
    instructions: roles/graphics.md
    owns: [graphics, research/graphics, handoffs/graphics]
  builder:
    instructions: roles/builder.md
    owns: [stack.md, coding-standards.md, build, qa/build, qa/site-audit.md, qa/accessibility.md, qa/contrast.md, qa/security-headers.md, audit, release, research/builder, handoffs/builder]
    external_owns: [implementation_root, implementation_root/SITE_OPERATIONS.md]
  optimizer:
    instructions: roles/optimizer.md
    owns: [optimization, qa/seo-aeo.md, research/optimizer, handoffs/optimizer]
  reviewer:
    instructions: roles/reviewer.md
    owns: []
    authors: [research-packet, findings.md, handoff.yaml]
    output_delivery: return-to-coordinator
    source_access: read-only
handoff:
  required: [stage, status, input_revision, artifact_revision, producer_role, producer_model_family, artifacts, checks, limitations, next_owner, changed_assumptions, framing_reset]
