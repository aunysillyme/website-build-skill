{
  "name": "Scorecard",
  "on": {
    "push": {
      "branches": ["main"]
    },
    "schedule": [
      { "cron": "30 1 * * 6" }
    ]
  },
  "permissions": { "contents": "read" },
  "concurrency": {
    "group": "${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "analysis": {
      "name": "Scorecard analysis",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "permissions": {
        "contents": "read",
        "actions": "read",
        "security-events": "write",
        "id-token": "write"
      },
      "steps": [
        {
          "name": "Checkout code (checkout v7.0.1)",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": { "persist-credentials": false }
        },
        {
          "name": "Run analysis (scorecard-action v2.5.0)",
          "uses": "ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e",
          "with": {
            "results_file": "results.sarif",
            "results_format": "sarif",
            "publish_results": true
          }
        },
        {
          "name": "Upload artifact (upload-artifact v7.0.2)",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "SARIF file",
            "path": "results.sarif",
            "retention-days": 5
          }
        },
        {
          "name": "Upload to code-scanning (upload-sarif v4.38.3)",
          "uses": "github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d",
          "with": { "sarif_file": "results.sarif" }
        }
      ]
    }
  }
}
