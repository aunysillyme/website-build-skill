{
  "name": "Repository checks",
  "on": {
    "pull_request": {},
    "push": {
      "branches": [
        "main"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "checks": {
      "name": "Repository checks",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Check out source (checkout v4.2.2)",
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Select maintainer runtime (setup-node v4.4.0)",
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "22.22.3"
          }
        },
        {
          "name": "Content, links, privacy, bundle drift and evidence gates",
          "run": "node --experimental-strip-types scripts/check.ts"
        },
        {
          "name": "RED cases and valid controls",
          "run": "node --experimental-strip-types --test test/*.test.ts",
          "if": "always()"
        }
      ]
    }
  }
}
