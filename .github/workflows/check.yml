{
  "name": "Repository checks",
  "on": {
    "pull_request": {},
    "push": {
      "branches": [
        "main"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "checks": {
      "name": "Repository checks (${{ matrix.os }}, Node ${{ matrix.node }})",
      "runs-on": "${{ matrix.os }}",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Check out source (checkout v7.0.1)",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Select runtime (setup-node v7.0.0)",
          "uses": "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020",
          "with": {
            "node-version": "${{ matrix.node }}"
          }
        },
        {
          "name": "Content, links, privacy, bundle drift and evidence gates",
          "run": "node scripts/check.mjs"
        },
        {
          "name": "RED cases and valid controls",
          "run": "node --test test/*.test.mjs",
          "if": "${{ always() && runner.os == 'Linux' }}"
        },
        {
          "name": "Packed consumer install: SOLO and TEAM",
          "run": "node --test test/packed-artifact.test.mjs",
          "if": "${{ runner.os != 'Linux' }}"
        }
      ],
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "node": [
            "18",
            "20",
            "22.22.3",
            "24"
          ],
          "os": [
            "ubuntu-latest"
          ],
          "include": [
            {
              "os": "macos-latest",
              "node": "22.22.3"
            },
            {
              "os": "windows-latest",
              "node": "22.22.3"
            }
          ]
        }
      }
    },
    "required-check": {
      "name": "Repository checks",
      "needs": [
        "checks"
      ],
      "if": "${{ always() }}",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 2,
      "steps": [
        {
          "name": "Require every matrix check to succeed",
          "env": {
            "CHECKS_RESULT": "${{ needs.checks.result }}"
          },
          "run": "test \"$CHECKS_RESULT\" = success"
        }
      ]
    }
  }
}
